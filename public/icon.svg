<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#060a18" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Outer accent ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.4" />
  <!-- Inner accent ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.6" stroke-dasharray="16 10" />
  <!-- Central emblem (Kanji 無 for Gojo / Tanpa Batas) -->
  <text x="256" y="295" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="160" font-weight="900" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">無</text>
  <!-- Small badge at bottom -->
  <rect x="156" y="380" width="200" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <text x="256" y="408" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="2" text-anchor="middle">KEUANGAN</text>
</svg>
